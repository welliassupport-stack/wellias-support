<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WELLIAS — the word game for nutrition lovers</title>
<meta name="description" content="WELLIAS is an alias-style word-guessing party game for nutritionists, health coaches and wellness fans. ">
<meta name="theme-color" content="#F7F8EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8EF;--ink:#283618;--card:rgba(128,128,128,.10);--rule:rgba(128,128,128,.28)}
@supports (color:color-mix(in srgb,red,blue)){:root{--card:color-mix(in srgb,var(--ink) 7%,transparent);--rule:color-mix(in srgb,var(--ink) 20%,transparent)}}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;transition:background-color .35s,color .35s;-webkit-font-smoothing:antialiased}
.mono{font-family:'DM Mono',ui-monospace,monospace}
#hero{position:relative;height:100vh;height:100svh;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#in{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;caret-color:transparent;font-size:16px;border:0;padding:0;outline:0;background:transparent;color:transparent}
.chrome{position:absolute;z-index:2}
#brand{left:24px;top:22px}
#brand b{display:block;font:700 22px/1 'Playfair Display',Georgia,serif;letter-spacing:.02em}
#brand span{display:block;margin-top:8px;font:400 9px/1.2 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
#top{position:absolute;right:24px;top:22px;display:flex;align-items:center;gap:10px}
#lang{display:flex;border:1px solid var(--rule);border-radius:99px;overflow:hidden}
#lang button{all:unset;cursor:pointer;font:400 10px/1 'DM Mono',monospace;letter-spacing:.1em;padding:9px 11px;opacity:.55}
#lang button[aria-pressed=true]{opacity:1;background:var(--ink);color:var(--bg)}
#down{font:400 10px/1 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:inherit;text-decoration:none;border:1px solid var(--rule);border-radius:99px;padding:9px 14px;opacity:.75;transition:opacity .2s}
#down:hover{opacity:1}
#rail{right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px}
#rail button{width:18px;height:18px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 1px var(--rule);transition:transform .2s,box-shadow .2s}
#rail button:hover{transform:scale(1.2)}
#rail button[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
#keys{left:24px;bottom:22px;font:400 10px/1.7 'DM Mono',monospace;opacity:.45;white-space:pre;pointer-events:none}
#tools{right:24px;bottom:20px;display:flex;gap:16px;font:400 10px/1 'DM Mono',monospace;letter-spacing:.08em}
#tools button{all:unset;cursor:pointer;opacity:.55;padding:6px 0;text-transform:lowercase}
#tools button:hover{opacity:1}
main{max-width:720px;margin:0 auto;padding:96px 24px 40px}
.eyebrow{font:500 12px 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin:0 0 18px}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.12;margin:0 0 18px}
h1{font-size:clamp(32px,6vw,48px)}
h2{font-size:clamp(26px,4.5vw,34px)}
p{font-weight:300;font-size:17px;line-height:1.65;margin:0 0 16px;max-width:56ch}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:36px 0 18px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:22px 22px 20px;backdrop-filter:blur(14px)}
.card h3{margin:0 0 6px;font:500 16px 'Outfit',sans-serif}
.card p{font-size:15px;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.badge{border:1px solid var(--rule);border-radius:14px;padding:12px 20px;font:500 14px 'Outfit',sans-serif;opacity:.55}
.badge small{display:block;font:400 9px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
section{padding-top:72px}
.email{display:inline-flex;margin-top:6px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;font-size:15px;padding:13px 24px;border-radius:99px}
.faq div{border-bottom:1px solid var(--rule);padding:20px 0}
.faq div:first-child{border-top:1px solid var(--rule)}
.faq b{display:block;font-weight:500;font-size:16px;margin-bottom:6px}
.faq span{font-weight:300;font-size:15px;line-height:1.6;display:block;opacity:.85}
.faq a{color:inherit}
footer{max-width:720px;margin:0 auto;padding:56px 24px 64px;font:400 11px 'DM Mono',monospace;letter-spacing:.06em;opacity:.55}
@media (max-width:640px){#keys{display:none}}
html[data-touch] #keys{display:none}
@media (max-width:560px){#brand{left:16px}#top{right:16px;gap:8px;flex-direction:column;align-items:flex-end}#down{padding:9px 10px}#keys{left:16px}#tools{right:16px}#rail{right:12px}}
</style>
</head>

<div id="hero">

  <div class="chrome" id="brand"><b>WELLIAS</b></div>
  <div class="chrome" id="top">
    <div id="lang" role="group" aria-label="Language"><button type="button" data-l="en">EN</button><button type="button" data-l="ru">RU</button><button type="button" data-l="es">ES</button></div>

    <div class="card"><h3 data-i="f3t"></h3><p data-i="f3p"></p></div>

  <div class="badges">
    <div class="badge"><small data-i="soon"></small>App Store</div>
    <div class="badge"><small data-i="soon"></small>Google Play</div>
  </div>

    <p class="eyebrow" data-i="eyebrow2"></p>
    <h2 data-i="h2"></h2>
    <p data-i="supp"></p>
    <a class="email" href="mailto:wellias.support@gmail.com?subject=WELLIAS%20Support">wellias.support@gmail.com</a>

    <h2 style="margin-top:56px;font-size:22px" data-i="faqh"></h2>
    <div class="faq">
      <div><b data-i="q1"></b><span data-i="a1"></span></div>
      <div><b data-i="q2"></b><span data-i="a2"></span></div>

      <div><b data-i="q5"></b><span data-i="a5"></span></div>
      <div><b data-i="q6"></b><span data-i="a6"></span></div>
    </div>
  </section>
</main>

}

  var m=document.querySelector('meta[name=description]');if(m) m.setAttribute('content',d.desc);

  try{localStorage.setItem('wellias-lang',l)}catch(e){}
}
var bs=document.querySelectorAll('#lang button');
for(var i=0;i<bs.length;i++) bs[i].addEventListener('click',function(){apply(this.getAttribute('data-l'))});
apply(pick());

];
var IMG=[],bag=[];
SPR.forEach(function(s,i){var im=new Image();im.src=s.src;IMG.push(im);for(var k=0;k<s.wt;k++) bag.push(i)});

var hero=document.getElementById('hero'), cv=document.getElementById('c'), ctx=cv.getContext('2d');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,dpr=1,fs=100,fontStr='',raf=0,inView=true,ready=false,lastT=0,t0=0;
var xs=[],pos=[]; // letter x positions
// particles: 0 leaf (health), 1 speech bubble with a leaf (communication), 2 heart (friends / care)
var P=[],i;
for(i=0;i<N;i++) P.push({x:0,y:0,vy:0,rot:0,vr:0,amp:0,ph:0,k:1,type:0,front:false});

function rnd(a,b){return a+Math.random()*(b-a)}
function easeOutBack(x){var c1=1.70158,c3=c1+1,y=x-1;return 1+c3*y*y*y+c1*y*y}
function clamp(x,a,b){return x<a?a:x>b?b:x}

function spawn(p,initial){
  p.type=bag[Math.floor(Math.random()*bag.length)];
  p.front=Math.random()<0.3;
  var sc=Math.min(W,H*1.6)/760;
  p.k=sc*rnd(0.8,1.25)*(p.front?1.15:0.85);
  var hh=SPR[p.type].base*p.k;
  p.x=rnd(-0.02,1.02)*W;
  p.y=initial?rnd(-0.1,1.05)*H:-hh-rnd(0,H*0.25);
  p.vy=rnd(24,55)*(H/760)*(p.front?1.25:0.9);
  p.rot=rnd(-0.6,0.6);p.vr=rnd(-0.5,0.5);
  p.amp=rnd(14,40);p.ph=rnd(0,6.283);
}

function layoutWord(){
  var size=Math.round(Math.min(W*0.17,H*0.3)); if(size<40) size=40; if(size>240) size=240;
  fs=size;fontStr='700 '+fs+'px '+SERIF;ctx.font=fontStr;
  var tw=0,k,ws=[];
  for(k=0;k<WORD.length;k++){var w=ctx.measureText(WORD.charAt(k)).width+fs*0.02;ws.push(w);tw+=w}
  while(tw>W*0.88&&fs>30){fs=Math.round(fs*0.93);fontStr='700 '+fs+'px '+SERIF;ctx.font=fontStr;tw=0;ws.length=0;
    for(k=0;k<WORD.length;k++){var w2=ctx.measureText(WORD.charAt(k)).width+fs*0.02;ws.push(w2);tw+=w2}}
  var x=(W-tw)/2;xs.length=0;
  for(k=0;k<WORD.length;k++){xs.push(x+ws[k]/2);x+=ws[k]}
}

function drawP(p,t){
  var s=SPR[p.type],im=IMG[p.type];if(!im.complete||!im.naturalWidth) return;
  var hh=s.base*p.k,ww=hh*s.w/s.h;
  var fade=clamp((p.y+hh)/(H*0.12),0,1)*clamp((H*1.02-p.y)/(H*0.12),0,1);
  if(fade<=0) return;
  var sx=p.x+(reduce?0:Math.sin(t*0.9+p.ph)*p.amp);
  ctx.save();ctx.translate(sx,p.y);
  ctx.rotate(s.n==='olive'?Math.sin(t*1.1+p.ph)*0.45:p.rot);
  ctx.globalAlpha=(p.front?1:0.72)*fade;
  ctx.drawImage(im,-ww/2,-hh/2,ww,hh);
  ctx.restore();
}

function drawWord(now){
  ctx.font=fontStr;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle=INK;
  var base=H*0.56+fs*0.35,k;
  for(k=0;k<WORD.length;k++){
    var p=reduce?1:clamp((now-t0-k*170)/800,0,1);if(p<=0) continue;
    var s=easeOutBack(p),y=base+(reduce?0:Math.sin(now/1000*1.5+k*0.8)*fs*0.012);
    ctx.save();ctx.translate(xs[k],y);ctx.scale(s,s);ctx.globalAlpha=clamp(p/0.3,0,1);
    ctx.fillText(WORD.charAt(k),0,0);ctx.restore();
  }
  ctx.globalAlpha=1;
}
function draw(now){
  var t=now/1000,k;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  for(k=0;k<N;k++) if(!P[k].front) drawP(P[k],t);
  drawWord(now);
  for(k=0;k<N;k++) if(P[k].front) drawP(P[k],t);
  ctx.globalAlpha=1;
}
function frame(){
  raf=requestAnimationFrame(frame);
  var now=performance.now(),dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  for(var k=0;k<N;k++){
    var p=P[k];p.y+=p.vy*dt;p.rot+=p.vr*dt;p.fl+=p.fs*dt;
    if(p.y>H*1.05+p.sz) spawn(p,false);
  }
  draw(now);
}
function start(){if(reduce||raf||!ready||!inView||document.hidden) return;lastT=performance.now();raf=requestAnimationFrame(frame)}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
if('IntersectionObserver' in window) new IntersectionObserver(function(es){inView=es[0].isIntersecting;inView?start():stop()},{threshold:0}).observe(hero);

function resize(){
  W=hero.clientWidth;H=hero.clientHeight;dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  layoutWord();
  for(var k=0;k<N;k++) spawn(P[k],true);
  if(reduce) draw(performance.now());
}
window.addEventListener('resize',resize);

Promise.all([document.fonts.load('700 64px "Playfair Display"')]).catch(function(){}).then(function(){return document.fonts.ready}).then(function(){
  ready=true;t0=performance.now()+150;resize();start();
});
})();
